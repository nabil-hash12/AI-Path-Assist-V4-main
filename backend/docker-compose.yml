version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aipath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aipath
      POSTGRES_PASSWORD: aipath_dev_pw
      POSTGRES_DB: aipath_assist
    ports:
      - "5432:5432"
    volumes:
      - aipath_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipath -d aipath_assist"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aipath-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aipath_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aipath_pg_data:
  aipath_redis_data:
